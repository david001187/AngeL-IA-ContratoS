    <style>
        body {

            padding: 0;

        }

        #webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .wing-card-center {
            background: rgba(10, 32, 68, 0.65);
            backdrop-filter: blur(22px);
            border: 1.5px solid rgba(255, 215, 0, 0.6);
            border-radius: 36px;
        }

        .btn-glass-ice {
            background: rgba(56, 189, 248, 0.18);
            color: #f0f9ff;

        .adsterra-banner-container {
            background: rgba(5, 15, 35, 0.85);
            border: 1px dashed rgba(255, 215, 0, 0.4);

            justify-content: center;

<body class="relative min-h-screen flex flex-col justify-between">

    <canvas id="webgl-bg"></canvas>

    <div class="relative z-10 flex flex-col min-h-screen">

        <!-- Header -->
        <header class="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/35 border-b border-amber-400/30 px-4 py-3.5">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
                    <span class="font-cinzel font-black text-xl text-white">Angel<span class="text-cyan-300">.Revelador</span></span>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="toggleKeyModal()" class="text-xs font-semibold px-3.5 py-2 rounded-xl btn-glass-ice">Gemini API Key</button>
                </div>
            </div>
        </header>

        <!-- Banner Superior Adsterra Directo -->
        <div class="max-w-4xl mx-auto px-4 w-full mt-4 flex justify-center">
            <div class="adsterra-banner-container w-full">
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'b8113d67e8f04c994678796f49befc14',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="https://recordssponge.com/b8113d67e8f04c994678796f49befc14/invoke.js"></script>
            </div>
        </div>

        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-10">
            <section class="text-center space-y-4 max-w-3xl mx-auto pt-2">
                <h1 class="text-3xl sm:text-5xl font-extrabold font-cinzel text-white">
                    Auditoría de Contratos.
                </h1>
                <p class="text-sm sm:text-base text-sky-100/90">
                    Sube tu contrato. Nuestro personaje 3D analizará penalizaciones y cláusulas en tiempo real.
                </p>
            </section>

            <!-- Document Upload Box -->
            <section class="max-w-4xl mx-auto">
                <div class="wing-card-center p-8 text-center">
                    <p class="text-white font-bold">Panel de Carga listo</p>
                </div>
            </section>

            <!-- Banner Nativo Adsterra -->
            <section class="max-w-4xl mx-auto my-8">
                <div class="wing-card-center p-6 text-center">
                    <p class="text-[10px] uppercase font-mono text-amber-300/70 mb-3">Anuncios Patrocinados</p>
                    <script async="async" data-cfasync="false" src="https://recordssponge.com/244f55c0fc6d98516beadc04db062670/invoke.js"></script>
                    <div id="container-244f55c0fc6d98516beadc04db062670"></div>
                </div>
            </section>
        </main>

    </div>

    <!-- Escena Three.js 3D -->
    <script>
        let scene, camera, renderer;
        function initThreeJS() {
            const canvas = document.getElementById('webgl-bg');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 28;
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            animateThreeJS();
        }
        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);
            renderer.render(scene, camera);
        }
        window.onload = initThreeJS;
    </script>
</body>
</html>
